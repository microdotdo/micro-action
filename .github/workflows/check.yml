name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --exit-code -- dist/index.js
      - name: Exercise the packaged Action and released CLI
        uses: ./
        with:
          path: test/static-fixture
          dry-run: "true"
      - name: Exercise the portable Abla path
        uses: ./
        with:
          path: test/fixture
          dry-run: "true"
